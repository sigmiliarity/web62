<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: sans-serif;
        }
        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #error-message {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <div id="error-message">Loading Ruffle...</div>
    </div>

    <script src="r/ruffle.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const gameUrl = urlParams.get("g");
            const container = document.getElementById("player-container");

            if (!gameUrl) {
                container.innerHTML = `
                    <div id="error-message">
                        <h2>No game specified!</h2>
                        <p>Please provide a game URL using the <code>?g=RAW_URL</code> parameter.</p>
                        <p><em>Example: <code>?g=https://example.com/game.swf</code></em></p>
                    </div>
                `;
                return;
            }

            // Clear loading message
            container.innerHTML = "";

            // Create and configure the Ruffle player
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            
            // Style player to fill the screen while maintaining aspect ratio
            player.style.width = "100%";
            player.style.height = "100%";
            
            container.appendChild(player);
            player.load(gameUrl);
        });
    </script>
</body>
</html>
